[package]
name = "astrolabe-attestation"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
description = "Astrolabe attestation registry contract for Soroban"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
astrolabe-schema-registry = { path = "../schema-registry", features = ["testutils"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast"] }
