[workspace]
resolver = "2"
members = [
    "contracts/schema-registry",
    "contracts/attestation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/soroban-dev-tools/astrolabe-contracts"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
